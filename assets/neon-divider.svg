<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="40" viewBox="0 0 1200 40">
  <defs>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D1117" stop-opacity="0"/>
      <stop offset="20%" stop-color="#FF6B00"/>
      <stop offset="50%" stop-color="#FFAA00"/>
      <stop offset="80%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <rect y="16" width="1200" height="4" fill="url(#neon)" filter="url(#blur)"/>
  <rect y="18" width="1200" height="2" fill="url(#neon)"/>
  <circle cx="600" cy="19" r="6" fill="#FF6B00">
    <animate attributeName="r" values="4;8;4" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.8s" repeatCount="indefinite"/>
  </circle>
</svg>
