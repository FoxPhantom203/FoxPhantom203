<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="120" fill="#0D1117"/>
  <text x="600" y="55" font-family="Fira Code, monospace" font-size="36" font-weight="700" fill="url(#g)" text-anchor="middle" filter="url(#glow)">∞  FOXPHANTOM203  ∞</text>
  <text x="600" y="90" font-family="Fira Code, monospace" font-size="16" fill="#FF6B00" text-anchor="middle" opacity="0.85">Phantom of Infinite Code</text>
  <circle cx="80" cy="60" r="8" fill="#FF6B00">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1120" cy="60" r="8" fill="#FF6B00">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="1s" repeatCount="indefinite"/>
  </circle>
</svg>
